services:
  va-website:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://vaprofesionales.com}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
    image: fabrizziocastro/websites-containers:va-website
    container_name: va-website
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:80"
    networks:
      - websites-network

networks:
  websites-network:
    external: true
