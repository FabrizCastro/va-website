services:
  va-website:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://vaprofesionales.com}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
    image: fabrizziocastro/websites-containers:va-website
    container_name: va-website
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:80"
    networks:
      - websites-network

  va-backend:
    profiles: ["backend"]
    build:
      context: ../va-backend
      dockerfile: Dockerfile
    env_file:
      - ../va-backend/.env
    container_name: va-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - va_uploads_data:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - websites-network

  va-backend-worker:
    profiles: ["backend"]
    build:
      context: ../va-backend
      dockerfile: Dockerfile
    env_file:
      - ../va-backend/.env
    command: ["python", "-m", "app.integrations.worker"]
    container_name: va-backend-worker
    restart: unless-stopped
    volumes:
      - va_uploads_data:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - websites-network

networks:
  websites-network:
    external: true

volumes:
  va_uploads_data:
