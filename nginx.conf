server {
    listen 80;
    server_name www.vaprofesionales.com;

    return 301 https://vaprofesionales.com$request_uri;
}

server {
    listen 80;
    server_name vaprofesionales.com _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri.html $uri $uri/ =404;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
